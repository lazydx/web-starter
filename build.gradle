plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'io.github.lazydx'
version = '1.1.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.data:spring-data-commons'
    
    // Actuator support for health endpoints
    api 'org.springframework.boot:spring-boot-starter-actuator'
    
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    expand(project.properties)
}

jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            groupId = 'io.github.lazydx'
            artifactId = 'web-starter'
            version = '1.1.0'
            
            pom {
                name = 'Web Starter'
                description = 'Spring Boot starter for standardized web application development with pagination, file handling, and exception management'
                url = 'https://github.com/lazydx/web-starter'
                
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                
                developers {
                    developer {
                        id = 'lazydx'
                        name = 'LazyDX'
                        email = 'dev@lazydx.io'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/lazydx/web-starter.git'
                    developerConnection = 'scm:git:ssh://github.com:lazydx/web-starter.git'
                    url = 'https://github.com/lazydx/web-starter'
                }
                
                properties = [
                    'maven.compiler.source': '17',
                    'maven.compiler.target': '17',
                    'project.build.sourceEncoding': 'UTF-8'
                ]
            }
            
            suppressPomMetadataWarningsFor('runtimeElements')
            
            // 의존성 버전 정보 해결
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    
    repositories {
        maven {
            name = 'localRepo'
            url = layout.buildDirectory.dir('repo')
        }
        
        // Maven Central Repository 설정
        maven {
            name = 'OSSRH'
            def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = project.findProperty('ossrhUsername') ?: ''
                password = project.findProperty('ossrhPassword') ?: ''
            }
        }
    }
}

// Signing configuration - only sign if we have signing properties
signing {
    required { gradle.taskGraph.hasTask("publish") && project.hasProperty("signing.keyId") }
    sign publishing.publications.maven
}

// 로컬 Maven 저장소에 설치하는 태스크
task installToMavenLocal {
    dependsOn publishToMavenLocal
    doLast {
        println "=================================================================="
        println "Web-Starter ${version} installed to local Maven repository"
        println "=================================================================="
        println ""
        println "Add the following dependency to your project:"
        println ""
        println "For Gradle:"
        println "    implementation 'io.github.lazydx:web-starter:${version}'"
        println ""
        println "For Maven:"
        println "    <dependency>"
        println "        <groupId>io.github.lazydx</groupId>"
        println "        <artifactId>web-starter</artifactId>"
        println "        <version>${version}</version>"
        println "    </dependency>"
        println ""
        println "=================================================================="
    }
}
